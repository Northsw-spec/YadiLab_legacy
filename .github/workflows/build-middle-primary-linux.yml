name: Linux executable PR84 - middle paste fix
on:
  push:
    branches:
      - build/linux-middle-selection-pr84
permissions:
  contents: read
jobs:
  build-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify binary source is exactly PR84 HEAD
        run: |
          git merge-base --is-ancestor 68f7adceb8d43550571d76c5f2100df43e423143 HEAD
          git diff --quiet 68f7adceb8d43550571d76c5f2100df43e423143 -- network_core web tests README.md
      - name: Compile standalone Linux x86-64 executable
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --clean --noconfirm --onefile --console --name NetworkLab --paths . --add-data 'web:web' packaging/entrypoint.py
          file dist/NetworkLab
          test -x dist/NetworkLab
      - name: Black-box API, UI and disk Save/Open smoke
        run: python packaging/smoke_binary.py dist/NetworkLab
      - name: Black-box port collision startup smoke
        run: python packaging/smoke_startup_ports.py dist/NetworkLab
      - name: SHA256
        run: cd dist && sha256sum NetworkLab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NetworkLab-linux-x86_64-PR84-middle-paste-fix
          path: |
            dist/NetworkLab
            dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
