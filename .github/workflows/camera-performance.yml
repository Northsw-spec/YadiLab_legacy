name: SVG camera viewport performance
on:
  push:
    branches:
      - perf/svg-camera-raf-2026-11-22
permissions:
  contents: read
jobs:
  camera-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (tag resolved 2026-11-24)
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7 (tag resolved 2026-11-24)
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7 (tag resolved 2026-11-24)
        with:
          python-version: '3.13'
      - name: Pinned original camera baseline
        run: |
          git show 809d93d9e6a1edf4bb56923e2715dc289499d4bd:web/canvas.js > web/canvas-baseline.mjs
          test -s web/canvas-baseline.mjs
      - name: Run camera safety tests
        run: |
          node --check web/canvas.js
          node --test tests/canvas_zoom_bounds_test.mjs
      - name: Install real Chromium
        run: |
          python3 -m pip install playwright==1.57.0
          # Hosted Ubuntu already provides the browser shared libraries. Avoid
          # external APT source outages while installing the pinned browser.
          python3 -m playwright install chromium
      - name: Differential pan and zoom benchmark
        run: python3 tests/browser_camera_performance.py
      - name: Preserve reproducible benchmark measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svg-camera-performance
          path: research/camera-perf-results/camera.json
          if-no-files-found: warn
