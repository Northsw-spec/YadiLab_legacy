name: ELK layout focused acceptance
on:
  pull_request:
    paths:
      - 'web/features/layout/**'
      - 'web/canvas.js'
      - 'web/app.js'
      - 'tests/browser_elk_layout.py'
      - 'tests/browser_canvas_large_zoom.py'
      - 'tests/canvas_zoom_bounds_test.mjs'
permissions:
  contents: read
jobs:
  elk-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (tag resolved 2026-11-24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4 (tag resolved 2026-11-24)
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (tag resolved 2026-11-24)
        with:
          python-version: '3.13'
      - name: JavaScript safety contract and adapter negative tests
        run: |
          node --check web/features/layout/elk.js
          node --test tests/elk_layout_adapter_test.mjs tests/canvas_zoom_bounds_test.mjs
      - name: Install Chromium acceptance dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Full real HTTP Chromium ELK UI acceptance
        run: python3 tests/browser_elk_layout.py
      - name: Real Chromium large topology zoom acceptance
        run: python3 tests/browser_canvas_large_zoom.py
