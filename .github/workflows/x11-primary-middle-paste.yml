name: Linux X11 PRIMARY middle-paste regression (manual)
# Optional focused rerun for debugging. The REQUIRED release/PR gate is
# .github/workflows/ci.yml -> unit-tests -> Real X11 PRIMARY regression.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x11-primary-clipboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (tag resolved 2026-11-24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (tag resolved 2026-11-24)
        with:
          python-version: '3.13'
      - name: Install real X11 and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth xclip
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Verify PRIMARY selection middle click and ordinary Ctrl+V
        run: xvfb-run -a python3 tests/browser_primary_selection_x11.py
