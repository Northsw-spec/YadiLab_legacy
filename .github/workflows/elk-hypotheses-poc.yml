name: Isolated ELK hypothesis experiments
on:
  push:
    branches:
      - research/elk-hypotheses-2026-11-22
  workflow_dispatch:
permissions:
  contents: read
jobs:
  elk-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact ELK release in isolated research workspace
        run: npm install --no-save --package-lock=false --ignore-scripts elkjs@0.13.0
      - name: Validate actual ELK adapter, routing, node-only geometry, determinism
        run: node research/elk_hypotheses.mjs
        continue-on-error: true
      - name: Historical receipt verification tests on unchanged production source
        run: python3 -m unittest discover -s tests -p 'test_import_verification.py' -v
        continue-on-error: true
      - name: Explicit historical receipt plus Save/Open acceptance probe
        run: python3 research/elk_historical_guard_probe.py
        continue-on-error: true
      - name: Browser prerequisites
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Local real Chromium worker and topology editor SVG rendering probes
        run: python3 research/elk_browser_probe.py
        continue-on-error: true
      - name: Bounded 2000-node 5000-link ELK stress test
        run: timeout 120s node --max-old-space-size=4096 research/elk_hypotheses.mjs --stress
        continue-on-error: true
      - name: Upload full raw experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elk-hypotheses-evidence
          path: research/elk-results/
          if-no-files-found: warn
      - name: Strict aggregate verdict (fail CI on real hypothesis failure)
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/elk-results')
          errors=[]
          for name in ('node','browser','stress','historical'):
              f=p/(name+'.json')
              if not f.exists(): errors.append(name+' evidence missing'); continue
              data=json.loads(f.read_text())
              if data.get('errors'):errors.append(name+' execution errors: '+str(list(data['errors'])))
              if name=='stress' and data.get('results',{}).get('H7_stress_2000_5000',{}).get('acceptedByCanonicalModel') is not True:
                  errors.append('H7 coordinate bounds FAIL')
          print('RESEARCH_VERDICT:', 'FAIL / corrective research required' if errors else 'PASS', errors)
          raise SystemExit(1 if errors else 0)
          PY
